# spec/tracks/love-train.md#bm-ltdj-05: remix 1 of Love Train, the whole track.
# This version is a re-edit: the source's own bars in the remix plan's form,
# with BM-DRUM-02's Jersey shuffle (its fresh take's sounds) where no source bars play.
id = "BM-LTDJ-05"
title = "Remix 1, the whole track"
hear = "a DJ-friendly 8 minutes. Sixteen bars of swung kick and hats build to the clap. Then everything stops for the train, the original's groove drops on bar 33, and the song runs in the plan's order with its sections stretched and repeated. The train returns at bar 141 to drop the chorus again, and the source's own last train comes before the kit carries the outro. Every cut lands on a bar line, with no clicks, no gaps and no change of speed or pitch."
project = "Love Train remix 1: Detroit x Jersey"
bpm = 120
bars = 240
swing = 0.58


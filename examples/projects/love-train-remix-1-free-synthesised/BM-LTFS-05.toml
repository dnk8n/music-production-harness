# The train's horn, synthesised (the source's horn sounds like an E major
# chord set against the song's harmony): E3, G#3 and B3, from the second beat
# of an even bar. It swells for two bars and a beat, peaks on the third beat
# of its third bar, then bends down three semitones across the bar where the
# section drops.
[voices.horn]
sound = { synth = "mph_horn", why = "A passing train horn: two detuned reeds a note through a brassy resonance, swelling as it nears, then bending down and darker as it passes." }
chord = [0, 4, 7]
cues = [[34, "horn"], [110, "horn"], [194, "horn"]]

[voices.horn.mix]
highpass = 90
send = { echo = -inf, hall = -10 }

# Each horn's peak thrown into the echo as it lands the drop.
[voices.horn.automate]
echo = [[1, -inf], [36.5, -inf], [36.5, -4], [37.25, -4], [37.25, -inf], [112.5, -inf], [112.5, -4], [113.25, -4], [113.25, -inf], [196.5, -inf], [196.5, -4], [197.25, -4], [197.25, -inf]]

[voices.horn.phrases.horn]
gate  = ".  .  .  .  x  -  -  -  -  -  -  -  -  -  -  -  | -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  | -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  | -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -"
notes = "-  -  -  -  E3 -  -  -  -  -  -  -  -  -  -  -  | -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  | -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  | -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -"

# --- the mix (spec/components/mix.md) ---

# A dub echo on a dotted eighth, alternating left and right, fading into the hall.
[sends.echo]
kind = "delay"
beats = 0.75
feedback = 0.45
lowpass = 2800
pingpong = true
highpass = 300
level = -2
send = { hall = -10 }

[sends.hall]
kind = "reverb"
decay_s = 3.2
damping = 6000
predelay_ms = 25
highpass = 250
level = -4

[master]
highpass = 25

# The kick ducks the parts that hold under it: the bass, the organ bass and
# the strings. The stabs sit on the off-beats and need none. Dean's
# production duck: BM-SC-01's exaggerated take, 24 dB released over 430 ms.
[sidechain]
trigger = "kick"
targets = ["bass", "organ", "strings_a", "strings_b"]
depth_db = 24.0
attack_ms = 2.0
release_ms = 430.0

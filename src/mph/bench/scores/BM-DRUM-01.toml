# spec/components/benchmarks.md#bm-drum-01
id = "BM-DRUM-01"
title = "Detroit four-to-the-floor"
hear = "a driving, even pulse. Hats sit exactly between kicks (the offbeat \"tss\"), clap on 2 and 4. Mechanical on purpose, like early Underground Resistance or Jeff Mills."
bpm = 130
bars = 8

[voices.kick]
grid = "X . . . X . . . X . . . X . . ."
sound = { role = "kick", words = ["909"] }

[voices.clap]
grid = ". . . . x . . . . . . . x . . ."
sound = { role = "clap", words = ["909"] }

[voices.chh]
grid = ". . x . . . x . . . x . . . x ."
sound = { role = "hat", words = ["909"] }
seconds = 0.25

[variants.other-hat]
title = "the next-best catalogue hat, to compare sound design"
voices = { chh = { sound = { pick = 2 } } }

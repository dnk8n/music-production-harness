# spec/tracks/love-train.md#bm-ltdj-05: remix 1 of Love Train, the whole track.
# Version 2: only the vocal lines and the train's horn come from the source
# (from their stems, cued line by line); everything else is new Detroit techno
# with a splash of Jersey, mixed through strips, a dub echo and a hall.
id = "BM-LTDJ-05"
title = "Remix 1, the whole track"
hear = "a Detroit techno track that the song's voice moves through. A dry 909 groove builds with a rolling bass, and a fragment of the hook drifts past in the echo. Everything drops away for the train's horn, whose bend lands the groove. From there the vocal lines come one at a time, each on its own chords, each last word echoing into the gap, with the stabs answering in between. The hooks lift into Jersey: the organ bass, the shaker and the swelling strings. The dubs strip back to kick, rim, ride and echoing stabs, the breakdown floats on strings, and the horn drops the peak and, at the end, the outro. Nothing of the original's band plays."
project = "Love Train remix 1: Detroit x Jersey"
bpm = 120
bars = 240
swing = 0.55
rate = 48000

sections = [
  { name = "Intro", bars = [1, 8], play = ["kick", "chh", "rim"] },
  { name = "Intro", bars = [9, 16], play = ["kick", "chh", "rim", "ride", "vox"] },
  { name = "Build", bars = [17, 24], play = ["kick", "chh", "rim", "ride", "ohh", "bass"] },
  { name = "Build", bars = [25, 32], play = ["kick", "chh", "rim", "ride", "ohh", "bass", "clap", "stabs", "vox"] },
  { name = "Departure", bars = [33, 36], play = ["strings_a", "strings_b", "shaker", "vox", "siren"] },
  { name = "Groove A", bars = [37, 52], play = ["kick", "clap", "chh", "ohh", "ride", "rim", "bass", "stabs", "vox", "siren"] },
  { name = "Pre-chorus", bars = [53, 60], play = ["kick", "clap", "chh", "ohh", "ride", "bass", "stabs", "strings_a", "strings_b", "vox"] },
  { name = "Hook", bars = [61, 76], play = ["kick", "clap", "chh", "ohh", "shaker", "organ", "stabs", "strings_a", "strings_b", "vox"] },
  { name = "Dub", bars = [77, 92], play = ["kick", "rim", "ride", "chh", "bass", "stabs", "vox"] },

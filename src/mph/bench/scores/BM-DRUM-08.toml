# spec/components/benchmarks.md#bm-drum-08: son clave 3-2, shaker humanised +/-10% (seeded)
id = "BM-DRUM-08"
title = "Afro house clave"
hear = "the clave's 3-2 call-and-response sits over a steady kick. Congas answer between the clave hits, and the shaker gives constant motion with natural, uneven velocity (±10% humanisation, seeded)."
bpm = 122
project = "Drum patterns"
bars = 8
seed = 8

[voices.kick]
grid = "X . . . X . . . X . . . X . . ."
sound = { role = "kick" }

[voices.clave]
grid = "x . . x . . x . . . x . x . . ."
sound = { role = "clave" }

[voices.conga]
grid = ". . x . . x . x . . x . . . x x"
sound = { role = "conga" }

[voices.shaker]
grid = "x x x x x x x x x x x x x x x x"
sound = { role = "shaker" }
humanise = 0.1
seconds = 0.2

[variants.fresh-take]
title = "sounds an agent picked from the catalogue"


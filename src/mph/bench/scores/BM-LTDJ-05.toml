# --- the mix (spec/components/mix.md) ---

# A dub echo on a dotted eighth, alternating left and right, fading into the hall.
[sends.echo]
kind = "delay"
beats = 0.75
feedback = 0.45
lowpass = 2800
pingpong = true
highpass = 300
level = -2
send = { hall = -10 }

[sends.hall]
kind = "reverb"
decay_s = 3.2
damping = 6000
predelay_ms = 25
highpass = 250
level = -4

[master]
highpass = 25

# The kick ducks the parts that hold under it: the bass, the organ bass and
# the strings. The stabs sit on the off-beats and need none.
[sidechain]
trigger = "kick"
targets = ["bass", "organ", "strings_a", "strings_b"]
depth_db = 12.0
attack_ms = 2.0
hold_ms = 40.0
release_ms = 330.0

# The machine: a vocoder lead, the same formant voice opening 24 bands of a
# detuned saw and square. It teases the hook in the intro and the build,
# sings the bridge in the dub and verse 2, joins the lead's hook at the peak,
# and sings the tag in the dub-out.
[voices.robot]
sound = { synth = "mph_vocoder", why = "A vocoder lead, as Detroit techno uses one: 24 bands from 100 Hz to 8 kHz follow a formant voice and open the same bands of two detuned saws and a square." }
gain_db = -5
cues = [
  [14, "teaser"], [28, "teaser"], [84, "bridge-a"], [88, "bridge-b"], [116, "hook-low"],
  [120, "hook-low"], [124, "hook-low"], [130, "verse-a"], [134, "verse-b"], [138, "verse-c"],
  [180, "tag-a"], [184, "tag-b"],
]

[voices.robot.mix]
highpass = 150
level = -1
send = { echo = -inf, hall = -16 }

# The teasers filtered thin; the last word of every line thrown into the echo.
[voices.robot.automate]
highpass = [[1, 150], [14, 150], [14, 1200], [16, 1200], [16, 150], [28, 150], [28, 1200], [30, 1200], [30, 150]]

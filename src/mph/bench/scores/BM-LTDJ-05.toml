# --- drums: a 909-style kit from Dean's library (nothing there is tagged 909) ---

# Four to the floor, with a push on the last eighth of every fourth bar.
[voices.kick]
grid = "X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . x ."
sound = { role = "kick", hash = "8b9bc78a69c19943c681ae08110ee1e5f97a53e45eaac9c8b20de1185cb78dcf", why = "SIG_Kick_13 from Signature Techno: the classic 909 shape, tuned low (51 Hz body) with a short tail and a click near 1.3 kHz." }

[voices.kick.mix]
highpass = 28

[voices.clap]
grid = ". . . . x . . . . . . . x . . ."
sound = { role = "clap", hash = "cccc79ea221e63999ed05028afdd327d9aa357f43cd717316d30951946ffaf24", why = "SIG_Clap_03 from Signature Techno: a short, crisp, noisy 909-type clap." }

[voices.clap.mix]
highpass = 180
level = -1
send = { hall = -16 }

# Closed hats on the sixteenths around the open hats, which they choke.
[voices.chh]
grid = "x x . x x x . x x x . x x x . x"
sound = { role = "hat", hash = "75abc428886c3cdb6ddd5b586e391993cd7b19c38510f522f9fbcd79b85bea0a", why = "DRT_Analogue_Closed_Hat_03 from Deep & Raw Techno: short analogue hiss with no ring." }
chokes = ["ohh"]

[voices.chh.mix]
highpass = 350
pan = 0.15
level = -2

# Rising under the second horn.
[voices.chh.automate]
level = [[1, -2], [109, -2], [109, -20], [113, -2]]

[voices.ohh]
grid = ". . o . . . o . . . o . . . o ."
sound = { role = "hat_open", hash = "489ba8a29f7197b4463ae16d407c676e3bef80316c50d6b123cb2941eba53318", why = "UMK_Open_Hat_12 (Umek): a techno open hat that rings on the off-beat with no ring tone." }

[voices.ohh.mix]
highpass = 400
pan = -0.15
level = -2
send = { hall = -22 }

# The ride on the eighths, cut before the next one like a 909's decay.
[voices.ride]
grid = "x . X . x . X . x . X . x . X ."
sound = { role = "ride", hash = "e7479f9cf7ff6aeeed05abe5512209cee35d48ee87cc576dcddd3e6e25b36bde", why = "KDE_Ride_1 (Kid Massive): a long, washy ride, the closest to the 909 Detroit ride in the library." }
seconds = 0.24
gain_db = -4

[voices.ride.mix]
highpass = 500
pan = 0.3
level = -3
send = { hall = -18 }

# A syncopated two-bar figure, echoing deeper in the dubs.
[voices.rim]
grid = ". . . x . . x . . . . x . . x . | . x . . . . x . . . x . . . . ."
sound = { role = "rim", hash = "817c97deb662e360f73a36a26a7cffcf89852015f115e941d6192b873ef06303", why = "DSR_Rimshot_05 (Darius Syrossian): a short, high 909-style click near 1.4 kHz." }

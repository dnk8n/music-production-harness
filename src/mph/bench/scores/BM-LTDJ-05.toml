lowpass = 5000
send = { hall = -20 }

# One minor seventh shape moved in parallel (chord memory): E minor 7 over the
# C bars and A minor 7 over the F bars, which make Cmaj9 and Fmaj9 with the
# song's roots. Off-beat sixteenths, into the dub echo.
[voices.stabs]
notes = "-  -  -  E4 -  -  -  -  -  -  E4 -  -  -  -  -  | -  -  -  A3 -  -  A3 -  -  -  -  -  -  A3 -  -"

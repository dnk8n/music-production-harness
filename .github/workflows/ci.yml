name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests, spec
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Lua for the Renoise bridge tests
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends lua5.1
      - name: Format, lint, types, spec gate (pre-commit hooks; REQ-ENG-07, REQ-PRC-01, REQ-PRC-02)
        env:
          RUFF_OUTPUT_FORMAT: github
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Tests (macOS-only tests deselected)
        run: uv run pytest -m "not macos and not tools" --cov=mph --cov-report=term-missing

  security:
    name: secrets and dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Dependency audit
        run: uv export --locked --format requirements-txt --no-emit-project > requirements.txt && uvx pip-audit -r requirements.txt --strict

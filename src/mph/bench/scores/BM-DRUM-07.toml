# spec/components/benchmarks.md#bm-drum-07: toms every 3 sixteenths, across bar lines
id = "BM-DRUM-07"
title = "Tribal techno, 3 against 4"
hear = "the toms seem to rotate against the kick, since the pattern only lines up again every 3 bars. Hypnotic rather than repetitive."
bpm = 128
project = "Drum patterns"
bars = 12

[voices.kick]
grid = "X . . . X . . . X . . . X . . ."
sound = { role = "kick" }

[voices.tom]
pulse = 3
sound = { role = "tom" }

[voices.chh]
grid = ". . x . . . x . . . x . . . x ."
sound = { role = "hat" }
seconds = 0.25

[variants.fresh-take]
title = "sounds an agent picked from the catalogue"

[variants.fresh-take.voices.kick.sound]
hash = "d9d397e6243c0fe0b342fa84958b72d4f8eb2a7c42a40782c49bab60a289c3ea"
why = "A kick from Umek's pack, one of tribal techno's defining producers: very deep (centroid 44 Hz) under the rotating toms."

[variants.fresh-take.voices.tom.sound]
hash = "e50ee18093f5132dd45345ba296851c6a897b180616be3f7de34fe7399e74554"
why = "A short, dry low tom from Deep & Raw Techno. The 3-against-4 pattern stays clear without the long ambient tail, and it has little low end, so it stays out of the kick's way."

[variants.fresh-take.voices.chh.sound]
hash = "1ddc421179f7f876e10c6bea3bedd04a26b328a03ea6ab1304e54a84a6d964ca"
why = "A short Signature Techno hat, a dry techno tick for a hypnotic loop; it hisses rather than whistles."

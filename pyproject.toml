[project]
name = "mph"
version = "0.1.0"
description = "Music Production Harness: spec-driven, deterministic music production tooling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mph = "mph.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "mypy>=1.13",
  "ruff>=0.8",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes, I: isort, B: bugbear, S: bandit security,
# UP: pyupgrade, SIM: simplify, C90: complexity, PL: pylint subset, RUF: ruff-specific
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM", "C90", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
# The process runner is the single sanctioned place that spawns subprocesses.
"src/mph/proc.py" = ["S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "req(id): links a test to a spec requirement ID for traceability",
  "macos: requires macOS (Keychain, app bundles)",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

# spec/components/benchmarks.md#bm-drum-02
id = "BM-DRUM-02"
title = "Jersey garage shuffle"
hear = "the same four-on-the-floor, but every second 16th hat arrives late, so the hats skip and bounce. Open hats on the offbeat give the Jersey and Paradise Garage lift (Tony Humphries, Kerri Chandler)."
bpm = 122
project = "Drum patterns"
bars = 8
swing = 0.58

[voices.kick]
grid = "X . . . X . . . X . . . X . . ."
sound = { role = "kick" }

[voices.clap]
grid = ". . . . x . . . . . . . x . . ."
sound = { role = "clap" }

[voices.chh]
grid = "x x x x x x x x x x x x x x x x"
sound = { role = "hat" }
chokes = ["ohh"]
seconds = 0.25

[voices.ohh]
grid = ". . o . . . o . . . o . . . o ."
sound = { role = "hat_open" }

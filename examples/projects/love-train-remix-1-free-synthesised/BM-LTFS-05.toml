# The group: three voices in parallel major triads (F, G and C), answering
# the lead and holding chords under its ad-libs.
[voices.choir]
sound = { synth = "mph_singer", why = "The lead's formant voice three times over, softer and breathier, each part with its own vibrato and waver." }
chord = [0, 4, 7]
params = { attack = 0.12, release = 0.35, vibrato = 0.25, breath = 0.08, scoop = 0.3 }
gain_db = -3
cues = [
  [62, "answer"], [66, "answer"], [70, "answer"], [72, "vamp"], [76, "vamp"],
  [106, "answer"], [118, "answer"], [122, "answer"], [126, "answer"], [154, "answer"],
  [158, "answer"], [162, "answer"], [164, "pad"], [168, "pad"], [172, "pad"],
  [202, "answer"],
]

[voices.choir.mix]
highpass = 150
level = -5
send = { hall = -10 }

# The outro's answer filtered thin, as the lead's hook line is.
[voices.choir.automate]
highpass = [[1, 150], [202, 150], [202, 500], [204, 500], [204, 150]]


# --- the synths ---

# Rolling on every sixteenth, C in odd bars and F in even bars, with octave
# jumps and a glide down to G. The kick ducks it.
[voices.bass]
notes  = "C2 C2 C2 C2 C2 C2 C3 C2 C2 C2 C2 C2 C2 C2 C3 C2 | F1 F1 F1 F1 F1 F1 F2 F1 F1 F1 F1 F1 F2 F2 G1 G1"
gate   = "x  x  x  x  x  x  x  x  x  x  x  x  x  x  x  x  | x  x  x  x  x  x  x  x  x  x  x  x  x  x  x  x"
accent = ".  .  X  .  .  .  X  .  .  .  X  .  .  .  X  .  | .  .  X  .  .  .  X  .  .  .  X  .  .  .  X  ."
slide  = ".  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  | .  .  .  .  .  .  .  .  .  .  .  .  .  S  .  ."
sound = { synth = "mph_bass" }
params = { cutoff = 380.0, resonance = 0.3, envmod = 0.5, decay = 0.14, sub = 0.9, glide = 0.06 }

[voices.bass.mix]
highpass = 30
lowpass = 250
resonance = 0.35

# Opening through the builds, closing down through the dubs.
[voices.bass.automate]
lowpass = [[1, 250], [17, 250], [25, 1400], [33, 2000], [53, 2000], [61, 3000], [77, 3000], [77, 500], [93, 900], [113, 900], [113, 3500], [129, 3500], [129, 2200], [145, 2200], [153, 3200], [177, 3200], [177, 2000], [193, 220], [197, 220], [197, 1200], [209, 1200], [225, 600]]

# The Jersey organ bass (after a Korg M1 "Organ 2"): a syncopated garage line
# with octave jumps, in place of the Detroit bass in the hooks.
[voices.organ]
notes  = "C2 -  -  C3 -  -  C2 -  C2 -  -  C3 -  -  G2 -  | F2 -  -  F3 -  -  F2 -  F2 -  -  F3 -  F2 G2 -"

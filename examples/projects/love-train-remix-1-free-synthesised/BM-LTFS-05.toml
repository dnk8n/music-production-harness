# spec/tracks/love-train.md#bm-ltfs-05: the free version of remix 1, the whole track.
# Remix 1's form, parts and mix (BM-LTDJ-05), with everything that was a
# recording or a sample made anew: a synthesised 909 kit, new wordless vocal
# lines for a soul singer, a machine (a vocoder) and a group, and a
# synthesised train horn. It needs no samples, no recordings and no keys, so
# it renders the same from a fresh clone (issue #68).
id = "BM-LTFS-05"
title = "Remix 1 for everyone, the whole track"
hear = "a Detroit techno track sung by a soul singer, a machine and a group, with nothing recorded. A dry 909 groove builds with a rolling bass, and the machine teases the hook through the echo. Everything drops away for the train's horn, whose bend lands the groove. The singer's verse comes in line by line, each last word echoing into the gap, with the stabs answering in between. In the hooks the group answers every line, and the organ bass, the shaker and the swelling strings lift it into Jersey. The machine takes the bridge in the dub and sings the second verse, and at the peak it sings the hook with the singer, a third below. The horn drops the peak and, at the end, the outro."
project = "Love Train remix 1, free: synthesised"
bpm = 120
bars = 240
swing = 0.55
rate = 48000

sections = [
  { name = "Intro", bars = [1, 8], play = ["kick", "chh", "rim"] },
  { name = "Intro", bars = [9, 16], play = ["kick", "chh", "rim", "ride", "robot"] },
  { name = "Build", bars = [17, 24], play = ["kick", "chh", "rim", "ride", "ohh", "bass"] },
  { name = "Build", bars = [25, 32], play = ["kick", "chh", "rim", "ride", "ohh", "bass", "clap", "stabs", "robot"] },
  { name = "Departure", bars = [33, 36], play = ["strings_a", "strings_b", "shaker", "horn"] },
  { name = "Groove A", bars = [37, 52], play = ["kick", "clap", "chh", "ohh", "ride", "rim", "bass", "stabs", "lead", "horn"] },
  { name = "Pre-chorus", bars = [53, 60], play = ["kick", "clap", "chh", "ohh", "ride", "bass", "stabs", "strings_a", "strings_b", "lead"] },
  { name = "Hook", bars = [61, 76], play = ["kick", "clap", "chh", "ohh", "shaker", "organ", "stabs", "strings_a", "strings_b", "lead", "choir"] },
  { name = "Dub", bars = [77, 83], play = ["kick", "rim", "ride", "chh", "bass", "stabs", "lead", "choir"] },
  { name = "Dub", bars = [84, 92], play = ["kick", "rim", "ride", "chh", "bass", "stabs", "robot"] },

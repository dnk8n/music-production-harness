# spec/components/benchmarks.md#bm-afro-02: a 12/8 ensemble with the jembe feel, 41:31:28 (REQ-BEN-13)
id = "BM-AFRO-02"
title = "Jembe feel"
hear = "next to BM-AFRO-01's even triplets, the ensemble leans. The first pulse of each beat is held a little long and the next two hurry in, so the tones and slaps tumble toward the next kick. It sounds played rather than programmed, while every kick stays exactly on the grid. In the even take the parts sit squarely in thirds, and the lean goes."
bpm = 122
project = "North star"
bars = 8
seed = 12
feel = [41, 31, 28]

[voices.kick]
grid = "X . . . X . . . X . . . X . . ."
sound = { role = "kick", words = ["909"] }

[voices.bell]
grid = "X . x . x x . x . x . x"
sound = { role = "bell" }

[voices.shaker]
grid = "X x x X x x X x x X x x"
sound = { role = "shaker" }
humanise = 0.08
seconds = 0.2

[voices.tone]
grid = ". x x . . . . x x . . ."
sound = { role = "djembe", words = ["tone"] }
params = { stroke = 1 }

[voices.slap]
grid = ". . . . x x . . . . x x"
sound = { role = "djembe", words = ["slap"] }
params = { stroke = 2 }

[voices.dunun]
grid = ". . . . . X . . x . . x"
sound = { role = "dunun" }

[variants.even]
title = "the same parts in even triplets, to hear what the feel adds"
feel = [1, 1, 1]

[variants.fresh-take]
title = "sounds an agent picked from the catalogue"

[variants.fresh-take.voices.kick.sound]
hash = "76446389da795ddc3c9e370fec261970105cf0e0cf2e0863e52d0d82922be7f6"
why = "A short, round kick from Dave Seaman's Electronic Underground pack that stays exactly on the grid under the leaning ensemble."

[variants.fresh-take.voices.bell.sound]
hash = "afaf6a830ce36bea5a39da5fea10036e3bf5907bac470d96f3bd126fca851712"
why = "A real drum-machine cowbell (707) in place of the synth bell: short and metallic, a common stand-in for the bell part in Afro house. Worth one listen."

[variants.fresh-take.voices.shaker.sound]
hash = "530cd0bdb9258cb971185168ca7963599935dd603cf4bd8a890ff15f2f765caf"
why = "A crisp, dry shaker; with humanise 0.08 it should show the lean well."

[variants.fresh-take.voices.tone.sound]
synth = "mph_djembe"
why = "Kept the synth: the catalogue's djembes are all loops, and the one-shot doumbek (DUMBEK FLM) is a flam, not a clean tone stroke."

[variants.fresh-take.voices.slap.sound]
synth = "mph_djembe"
why = "Kept the synth: there are no djembe slap one-shots. The Freesound djembe downloads are 120 bpm loops, not single strokes."

[variants.fresh-take.voices.dunun.sound]
synth = "mph_dunun"
why = "Kept the synth: the nearest catalogue hits (log drums, war drums) are rolls or have several onsets, and the deep single perc would mask the kick."

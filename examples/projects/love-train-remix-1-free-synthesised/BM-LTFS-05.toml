# --- drums: a 909-style kit, synthesised (synthdefs.scd) ---

# Four to the floor, with a push on the last eighth of every fourth bar.
[voices.kick]
grid = "X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . x ."
sound = { role = "kick", synth = "mph_kick909", why = "A 909-style kick: a sine that drops fast from five times its 50 Hz tune, with a click on top. Its body is down 18 dB 150 ms after it hits, so the duck is heard after every hit." }

[voices.kick.mix]
highpass = 28

[voices.clap]
grid = ". . . . x . . . . . . . x . . ."
sound = { role = "clap", synth = "mph_clap909", why = "A 909-style clap: band-passed noise struck four times, about 9 ms apart." }

[voices.clap.mix]
highpass = 180
level = -1
send = { hall = -16 }

# Closed hats on the sixteenths around the open hats, which they choke.
[voices.chh]
grid = "x x . x x x . x x x . x x x . x"
sound = { role = "hat", synth = "mph_hat909", why = "A 909-style hat: mostly hiss with a little metal, so it hisses rather than rings." }
chokes = ["ohh"]

[voices.chh.mix]
highpass = 350
pan = 0.15
level = -2

# Rising under the second horn.
[voices.chh.automate]
level = [[1, -2], [109, -2], [109, -20], [113, -2]]

[voices.ohh]
grid = ". . o . . . o . . . o . . . o ."
sound = { role = "hat_open", synth = "mph_hat909", why = "The same hat left to ring, until the next closed hat chokes it." }
params = { decay = 0.35 }

[voices.ohh.mix]
highpass = 400
pan = -0.15
level = -2
send = { hall = -22 }

# The ride on the eighths, each hit fading before the next, like a 909's.
[voices.ride]
grid = "x . X . x . X . x . X . x . X ."
sound = { role = "ride", synth = "mph_ride909", why = "A 909-style ride: a wash of noise and metal with a faint bell on top." }
params = { decay = 0.4 }
gain_db = -4

[voices.ride.mix]
highpass = 500
pan = 0.3
level = -3
send = { hall = -18 }

# A syncopated two-bar figure, echoing deeper in the dubs.
[voices.rim]
grid = ". . . x . . x . . . . x . . x . | . x . . . . x . . . x . . . . ."
sound = { role = "rim", synth = "mph_rim909", why = "A 909-style rim shot: resonators near 480 Hz and 1.45 kHz, struck once." }

[voices.rim.mix]
highpass = 300
pan = -0.3
level = -3
send = { echo = -14 }

[voices.rim.automate]
echo = [[1, -14], [77, -14], [77, -6], [93, -6], [93, -14], [177, -14], [177, -6], [193, -6], [193, -14]]

# The Jersey part: a garage shaker on the sixteenths, leaning on the off-beats.
[voices.shaker]
grid = "x x X x x x X x x x X x x x X x"
sound = { role = "shaker", synth = "mph_beads", why = "A garage shaker: seeded beads that swell and thin out through a high resonance." }

[voices.shaker.mix]
highpass = 600
pan = 0.35
level = -3
send = { hall = -20 }

# --- the synths ---

# Rolling on every sixteenth, C in odd bars and F in even bars, with octave
# jumps and a glide down to G. The kick ducks it.
[voices.bass]
notes  = "C2 C2 C2 C2 C2 C2 C3 C2 C2 C2 C2 C2 C2 C2 C3 C2 | F1 F1 F1 F1 F1 F1 F2 F1 F1 F1 F1 F1 F2 F2 G1 G1"
gate   = "x  x  x  x  x  x  x  x  x  x  x  x  x  x  x  x  | x  x  x  x  x  x  x  x  x  x  x  x  x  x  x  x"
accent = ".  .  X  .  .  .  X  .  .  .  X  .  .  .  X  .  | .  .  X  .  .  .  X  .  .  .  X  .  .  .  X  ."
slide  = ".  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  | .  .  .  .  .  .  .  .  .  .  .  .  .  S  .  ."
sound = { synth = "mph_bass" }
params = { cutoff = 380.0, resonance = 0.3, envmod = 0.5, decay = 0.14, sub = 0.9, glide = 0.06 }

[voices.bass.mix]
highpass = 30
lowpass = 250
resonance = 0.35

# Opening through the builds, closing down through the dubs.
[voices.bass.automate]
lowpass = [[1, 250], [17, 250], [25, 1400], [33, 2000], [53, 2000], [61, 3000], [77, 3000], [77, 500], [93, 900], [113, 900], [113, 3500], [129, 3500], [129, 2200], [145, 2200], [153, 3200], [177, 3200], [177, 2000], [193, 220], [197, 220], [197, 1200], [209, 1200], [225, 600]]

# The Jersey organ bass (after a Korg M1 "Organ 2"): a syncopated garage line
# with octave jumps, in place of the Detroit bass in the hooks.
[voices.organ]
notes  = "C2 -  -  C3 -  -  C2 -  C2 -  -  C3 -  -  G2 -  | F2 -  -  F3 -  -  F2 -  F2 -  -  F3 -  F2 G2 -"
gate   = "x  -  .  x  .  .  x  .  x  -  .  x  .  .  x  .  | x  -  .  x  .  .  x  .  x  -  .  x  .  x  x  ."
accent = ".  .  .  X  .  .  .  .  .  .  .  X  .  .  .  .  | .  .  .  X  .  .  .  .  .  .  .  X  .  .  .  ."
sound = { synth = "mph_organ" }
params = { cutoff = 1200.0, envmod = 2.0, decay = 0.12, chorus = 0.3, fifth = 0.25 }
gain_db = -1

[voices.organ.mix]
highpass = 40
lowpass = 5000
send = { hall = -20 }

# One minor seventh shape moved in parallel (chord memory): E minor 7 over the
# C bars and A minor 7 over the F bars, which make Cmaj9 and Fmaj9 with the
# song's roots. Off-beat sixteenths, into the dub echo.
[voices.stabs]
notes = "-  -  -  E4 -  -  -  -  -  -  E4 -  -  -  -  -  | -  -  -  A3 -  -  A3 -  -  -  -  -  -  A3 -  -"
gate  = ".  .  .  x  .  .  .  .  .  .  x  -  .  .  .  .  | .  .  .  x  .  .  x  .  .  .  .  .  .  x  .  ."
chord = [0, 3, 7, 10]
sound = { synth = "mph_stab" }
params = { cutoff = 700.0, resonance = 0.35, envmod = 3.5, decay = 0.2, release = 0.15 }
gain_db = -4

[voices.stabs.mix]
highpass = 250
lowpass = 600
resonance = 0.25
pan = 0.2
send = { echo = -8, hall = -14 }

# Dark in the builds, opening up through the grooves, wide open at the peak,
# and deeper into the echo in the dubs.
[voices.stabs.automate]
lowpass = [[1, 600], [37, 600], [53, 3200], [61, 4000], [77, 4000], [77, 1400], [93, 1400], [97, 2500], [113, 2500], [113, 8000], [129, 8000], [129, 3000], [153, 3000], [153, 4000], [177, 4000], [177, 1800], [197, 1800], [197, 2400]]
echo = [[1, -8], [77, -8], [77, -2], [93, -2], [93, -8], [177, -8], [177, -3], [197, -3], [197, -6]]

# Strings in two parts, so each chord rings out while the next swells in:
# Cmaj9 (E G B D above the bass's C) on odd bars, Fmaj9 (E G A C above F) on
# even bars, voiced above the voice.
[voices.strings_a]
notes = "E4 -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  | -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -"
gate  = "x  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  | .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  ."
chord = [0, 3, 7, 10]
sound = { synth = "mph_strings" }
params = { attack = 0.6, release = 1.4, cutoff = 4500.0, vibrato = 0.1 }
gain_db = -3

[voices.strings_b]
notes = "-  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  | E4 -  -  -  -  -  -  -  -  -  -  -  -  -  -  -"
gate  = ".  .  .  .  .  .  .  .  .  .  .  .  .  .  .  .  | x  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -"
chord = [0, 3, 5, 8]
sound = { synth = "mph_strings" }
params = { attack = 0.6, release = 1.4, cutoff = 4500.0, vibrato = 0.1 }
gain_db = -3

[voices.strings_a.mix]
highpass = 200
lowpass = 7000
pan = -0.2
send = { hall = -8 }

[voices.strings_b.mix]
highpass = 200
lowpass = 7000
pan = 0.2
send = { hall = -8 }

# Swelling in under each horn.
[voices.strings_a.automate]
level = [[1, -14], [37, 0], [109, 0], [109, -10], [113, 0], [193, 0], [193, -10], [197, 0]]

[voices.strings_b.automate]
level = [[1, -14], [37, 0], [109, 0], [109, -10], [113, 0], [193, 0], [193, -10], [197, 0]]

# --- the new vocals and the train's horn (REQ-TRK-08, REQ-BEN-19) ---

# Wordless soul lines (oh, yeah, la, ooh, a hum) in C major and A minor over
# the parts' Cmaj9 and Fmaj9. Each line is cued on an even bar and sung from
# its second beat, as the song's lines are, so it stays on its chords.

# The lead: a soul singer, a formant voice. It sings verse 1, the
# pre-choruses, the hooks, the vamp and the ad-libs.
[voices.lead]
sound = { synth = "mph_singer", why = "A soulful lead: a buzz through five formants that move from each consonant to its vowel, scooping up into every note, with a vibrato that fades in and a little breath." }
gain_db = -5
cues = [
  [40, "verse-a"], [44, "verse-b"], [48, "verse-c"], [52, "pre-a"], [56, "pre-b"],
  [60, "hook"], [64, "hook-b"], [68, "hook"], [72, "vamp"], [76, "vamp"],
  [80, "vamp-end"], [96, "pre-a"], [100, "pre-b"], [104, "hook"], [116, "hook"],
  [120, "hook-b"], [124, "hook"], [144, "pre-a"], [148, "pre-b"], [152, "hook"],
  [156, "hook-b"], [160, "hook"], [164, "adlib-a"], [168, "adlib-b"], [172, "adlib-c"],
  [200, "hook"],
]

[voices.lead.mix]
highpass = 120
send = { echo = -inf, hall = -18 }


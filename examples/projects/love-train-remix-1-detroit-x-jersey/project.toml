# One of Dean's example projects (spec/components/projects.md).
name = "Love Train remix 1: Detroit x Jersey"
about = """An 8-minute Detroit techno remix, with a splash of Jersey garage, of "Love Train" \
by PillowTalk x Soul Clap featuring Greg Paulus and Crew Love. Only the vocals and the \
train's horn come from the song; the drums, bass, chords, strings and effects are new. \
Four short blocks, rated early, and the whole track, each as a Renoise song and a \
SuperCollider render. For Dean's own listening, never to be released."""
spec = "spec/tracks/love-train.md"
